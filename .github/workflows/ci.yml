name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  php:
    name: PHP ${{ matrix.php }} — validate, analyse, unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.2", "8.4" ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: sodium, zip
          tools: composer:v2
      - run: composer validate --strict
      - uses: ramsey/composer-install@v3
      - run: composer analyse
      - run: composer test:unit

  integration:
    name: WordPress integration (wp-env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          extensions: sodium
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx wp-env start
      - run: composer test:integration
      - name: Collect wp-env logs on failure
        if: failure()
        run: npx wp-env logs all --watch=false || true

  worker:
    name: Worker — typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  lint:
    name: Shell and workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck bin/build.sh
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -ignore 'reusable workflow' .github/workflows/*.yml
